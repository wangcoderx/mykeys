<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyKeys</title>
<!-- MyKeys Tauri 界面；脱离 Tauri 在浏览器打开时才使用内置演示数据。 -->
<style>
:root{--blue:#007aff;--indigo:#5e5ce6;--green:#248a3d;--greenbg:#e9f8ed;--orange:#c76500;--orangebg:#fff4e5;--red:#d70015;--redbg:#fff0f1;--ink:#1d1d1f;--muted:#6e6e73;--subtle:#86868b;--canvas:#f5f5f7;--surface:#fff;--line:rgba(60,60,67,.16);--soft:rgba(60,60,67,.1);--ease:cubic-bezier(.22,.8,.24,1);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;min-width:680px;background:#fff;-webkit-font-smoothing:antialiased}body{overflow:hidden}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(0,122,255,.28);outline-offset:2px}
/* The native Tauri window owns the frame and macOS traffic lights. This element is
   the application surface, not the rounded presentation frame used by the demo. */
.app{width:100%;height:100%;min-height:560px;background:#fff;overflow:hidden;position:relative;isolation:isolate}.titlebar{height:58px;display:flex;align-items:center;padding:0 18px 0 82px;border-bottom:1px solid var(--soft);position:absolute;inset:0 0 auto;z-index:30;background:rgba(255,255,255,.88);backdrop-filter:saturate(180%) blur(18px);user-select:none}.brand{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:650;pointer-events:none}.brand img{width:29px;height:29px;border-radius:8px}.title-actions{margin-left:auto}.icon-btn{width:36px;height:36px;border-radius:11px;background:transparent;color:var(--muted);font-size:18px}.icon-btn:hover{background:var(--canvas);color:var(--ink)}
.viewport{position:absolute;inset:58px 0 0;overflow:hidden}.page{position:absolute;inset:0;display:none;opacity:0;transform:translateX(26px) scale(.985);will-change:transform,opacity;background:#fff}.page.active{display:block;opacity:1;transform:none}.page.entering{display:block;animation:pageIn .42s var(--ease) both}.page.leaving{display:block;animation:pageOut .28s var(--ease) both;pointer-events:none}.page.back-enter{display:block;animation:backIn .42s var(--ease) both}.page.back-leave{display:block;animation:backOut .28s var(--ease) both;pointer-events:none}@keyframes pageIn{from{opacity:0;transform:translateX(34px) scale(.985)}to{opacity:1;transform:none}}@keyframes pageOut{to{opacity:0;transform:translateX(-22px) scale(.992)}}@keyframes backIn{from{opacity:0;transform:translateX(-34px) scale(.985)}to{opacity:1;transform:none}}@keyframes backOut{to{opacity:0;transform:translateX(22px) scale(.992)}}
.center-page{height:100%;display:grid;place-items:center;padding:36px}.welcome{width:min(560px,90%);text-align:center}.hero-logo{width:100px;height:100px;border-radius:24px;box-shadow:0 18px 44px rgba(33,91,235,.22);animation:logoIn .7s var(--ease) both}@keyframes logoIn{from{opacity:0;transform:translateY(12px) scale(.9)}to{opacity:1;transform:none}}h1,h2,h3,p{margin-top:0}.display{font-size:44px;line-height:1.08;letter-spacing:-.045em;margin:24px 0 12px}.lede{font-size:18px;line-height:1.55;color:var(--muted);margin:0 auto 30px;max-width:490px}.fine{font-size:12px;line-height:1.5;color:var(--subtle)}
.primary,.secondary,.danger-btn{min-height:46px;padding:0 20px;border-radius:14px;font-weight:650;transition:transform .16s var(--ease),filter .16s;background:var(--blue);color:#fff}.primary:hover,.danger-btn:hover{filter:brightness(.96);transform:translateY(-1px)}.primary:active,.danger-btn:active{transform:scale(.98)}.secondary{background:var(--canvas);color:var(--ink)}.secondary:hover{background:#ececef}.danger-btn{background:var(--red)}.danger-btn:disabled{opacity:.35;cursor:not-allowed}.wide{width:100%}.text-btn{background:transparent;color:var(--blue);padding:8px;border-radius:9px;font-weight:550}.text-btn:hover{background:rgba(0,122,255,.07)}
.onboard{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:30px 48px}.progress{display:flex;justify-content:center;gap:8px}.progress i{width:7px;height:7px;border-radius:50%;background:#d1d1d6;transition:.3s var(--ease)}.progress i.on{width:24px;background:var(--blue)}.step-wrap{display:grid;place-items:center}.step{width:min(510px,100%);animation:stepIn .36s var(--ease) both}@keyframes stepIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.step h2{font-size:32px;letter-spacing:-.035em;margin-bottom:9px}.step>p{color:var(--muted);line-height:1.55;margin-bottom:26px}.onboard-foot{display:flex;justify-content:space-between;align-items:center}.complete-mark{width:86px;height:86px;border-radius:50%;background:var(--greenbg);color:var(--green);font-size:42px;display:grid;place-items:center;margin:0 auto 22px;animation:pop .5s var(--ease)}@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.field{display:block;margin-bottom:16px}.field>span{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin:0 0 7px 2px}.field small{color:var(--subtle);font-weight:450}.input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 14px;color:var(--ink);transition:.18s}.input{height:46px}textarea{min-height:92px;padding-top:12px;resize:none}.input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,122,255,.1);outline:none}.pass-wrap{position:relative}.pass-wrap .input{padding-right:74px}.show-pass{position:absolute;right:6px;top:5px;height:36px;background:transparent;color:var(--blue);padding:0 9px;border-radius:8px}.match{height:21px;font-size:12px;color:var(--green);opacity:0;transform:translateY(-4px);transition:.2s}.match.show{opacity:1;transform:none}
.provider-picker{position:relative}.provider-trigger{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 11px;display:flex;align-items:center;gap:10px;text-align:left;color:var(--ink);transition:border-color .18s,box-shadow .18s,background .18s}.provider-trigger:hover{background:#fafafa}.provider-trigger:focus-visible,.provider-picker.open .provider-trigger{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,122,255,.1);outline:none}.provider-mark{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:var(--canvas);display:grid;place-items:center;border:1px solid rgba(60,60,67,.06)}.provider-mark img{width:18px;height:18px;object-fit:contain}.provider-other{color:var(--muted);font-size:13px;font-weight:750;letter-spacing:1px}.provider-name{font-size:14px;font-weight:580;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.provider-chevron{width:8px;height:8px;margin-left:auto;margin-right:5px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .2s var(--ease)}.provider-picker.open .provider-chevron{transform:rotate(225deg) translate(-2px,-2px)}.provider-menu{position:absolute;z-index:55;top:calc(100% + 8px);right:0;width:min(420px,calc(200% + 16px));padding:7px;display:grid;grid-template-columns:1fr 1fr;gap:3px;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 48px rgba(0,0,0,.16),0 2px 8px rgba(0,0,0,.06);backdrop-filter:blur(20px);opacity:0;visibility:hidden;transform:translateY(-6px) scale(.985);transform-origin:top right;pointer-events:none;transition:opacity .16s,transform .2s var(--ease),visibility .2s}.provider-picker.open .provider-menu{opacity:1;visibility:visible;transform:none;pointer-events:auto}.provider-option{height:44px;padding:0 9px;border-radius:10px;background:transparent;display:flex;align-items:center;gap:9px;color:var(--ink);text-align:left}.provider-option:hover,.provider-option:focus-visible{background:var(--canvas);outline:none}.provider-option.selected{background:rgba(0,122,255,.08);color:#0068d8}.provider-option .provider-mark{width:28px;height:28px;flex-basis:28px;border-radius:8px;background:#fff}.provider-option.selected .provider-mark{box-shadow:0 0 0 1px rgba(0,122,255,.12)}.provider-check{margin-left:auto;color:var(--blue);font-size:14px;font-weight:700;opacity:0}.provider-option.selected .provider-check{opacity:1}
.choices{display:grid;gap:10px}.choice{padding:16px;border:1px solid var(--line);border-radius:16px;display:grid;grid-template-columns:22px 1fr;gap:12px;text-align:left;background:#fff;transition:.2s var(--ease)}.choice:hover{border-color:rgba(0,122,255,.4)}.choice.selected{border-color:var(--blue);background:rgba(0,122,255,.045);box-shadow:0 0 0 3px rgba(0,122,255,.08)}.radio{width:20px;height:20px;border:1.5px solid #aeaeb2;border-radius:50%;display:grid;place-items:center}.selected .radio{border-color:var(--blue)}.selected .radio:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--blue)}.choice b{font-size:15px}.choice small{display:block;color:var(--muted);line-height:1.4;margin-top:3px}.unlock-card{width:380px;text-align:center}.unlock-card .hero-logo{width:74px;height:74px;border-radius:20px}.unlock-card h1{font-size:30px;letter-spacing:-.03em;margin:18px 0 6px}.unlock-card p{color:var(--muted);font-size:14px;margin-bottom:22px}.shake{animation:shake .38s ease}@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.shell{height:100%;display:grid;grid-template-columns:188px 1fr}.sidebar{background:rgba(245,245,247,.72);border-right:1px solid var(--soft);padding:24px 14px;display:flex;flex-direction:column}.nav{display:grid;gap:4px}.nav-btn{height:42px;border-radius:11px;padding:0 12px;background:transparent;text-align:left;color:#3a3a3c;font-weight:550}.nav-btn:hover{background:rgba(120,120,128,.08)}.nav-btn.on{background:#fff;color:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.07)}.sidebar .status{margin-top:auto;padding:12px;font-size:12px;color:var(--muted);line-height:1.5}.safe-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px}.content{overflow:auto;padding:38px 42px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px}.page-head h1{font-size:32px;letter-spacing:-.035em;margin:0 0 4px}.page-head p{margin:0;color:var(--muted);font-size:14px}
.home-content{height:100%;display:grid;place-items:center;padding:36px}.home-inner{width:min(650px,90%)}.home-inner h1{font-size:38px;letter-spacing:-.04em;text-align:center;margin-bottom:8px}.home-inner>p{text-align:center;color:var(--muted);margin-bottom:32px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:16px}.action-card{height:190px;border-radius:24px;text-align:left;padding:25px;background:var(--canvas);position:relative;transition:.25s var(--ease);border:1px solid transparent}.action-card:hover{transform:translateY(-4px);background:#fff;border-color:var(--line);box-shadow:0 14px 34px rgba(0,0,0,.09)}.symbol{width:42px;height:42px;border-radius:13px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:25px;margin-bottom:26px}.fetch .symbol{background:var(--green)}.action-card b{display:block;font-size:22px}.action-card span:not(.symbol){display:block;color:var(--muted);font-size:13px;margin-top:6px}.action-card em{position:absolute;right:22px;bottom:18px;font-style:normal;color:var(--subtle);font-size:24px;transition:.2s}.action-card:hover em{transform:translateX(4px);color:var(--blue)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;max-width:700px}.span-2{grid-column:1/-1}.details{border-top:1px solid var(--soft);margin:8px 0 18px;padding-top:12px}.details summary{cursor:pointer;color:var(--blue);font-weight:600;font-size:14px;padding:8px 0;list-style:none}.details summary:after{content:"＋";float:right}.details[open] summary:after{content:"−"}.form-actions{display:flex;justify-content:flex-end;gap:10px}.secret-demo{font-family:"SFMono-Regular",Consolas,monospace}
.retrieve-layout{display:grid;grid-template-columns:minmax(290px,.9fr) minmax(330px,1.1fr);gap:22px;height:calc(100% - 80px)}.list-pane,.detail-pane{border:1px solid var(--soft);border-radius:20px;overflow:hidden;background:#fff}.search{margin:14px;width:calc(100% - 28px);height:42px;border:0;background:var(--canvas);border-radius:11px;padding:0 13px}.filters{display:flex;gap:6px;padding:0 14px 12px;overflow:auto}.chip{white-space:nowrap;border-radius:999px;padding:7px 11px;background:var(--canvas);color:var(--muted);font-size:12px}.chip.on{background:var(--ink);color:#fff}.key-list{border-top:1px solid var(--soft)}.key-row{width:100%;padding:13px 14px;display:grid;grid-template-columns:38px 1fr auto;gap:11px;align-items:center;background:#fff;text-align:left;border-bottom:1px solid var(--soft)}.key-row:hover{background:#fafafa}.key-row.on{background:rgba(0,122,255,.055)}.provider-logo{width:36px;height:36px;border-radius:10px;background:var(--canvas);padding:8px;object-fit:contain}.key-meta b{display:block;font-size:14px}.key-meta span{font-size:11px;color:var(--muted)}.badge{font-size:11px;font-weight:650;padding:5px 8px;border-radius:999px;background:var(--greenbg);color:var(--green)}.badge.warn{background:var(--orangebg);color:var(--orange)}.badge.bad{background:var(--redbg);color:var(--red)}.detail-pane{padding:25px;overflow:auto}.detail-top{display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--soft);padding-bottom:20px;margin-bottom:22px}.detail-top .provider-logo{width:50px;height:50px;border-radius:14px}.detail-top h2{margin:0 0 3px;font-size:22px}.detail-top p{margin:0;color:var(--muted);font-size:13px}.secret-box{padding:15px;border-radius:14px;background:var(--canvas);display:flex;align-items:center;gap:10px}.secret-value{font:13px "SFMono-Regular",Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.secret-actions{display:flex;gap:7px}.mini{height:34px;padding:0 11px;border-radius:9px;background:#fff;color:var(--blue);font-weight:600}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}.info dt{font-size:11px;color:var(--subtle);margin-bottom:5px}.info dd{margin:0;font-size:14px}.empty{height:180px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13px}
.settings-list{max-width:700px}.settings-group{margin-bottom:26px}.settings-label{font-size:12px;color:var(--muted);margin:0 0 8px 12px;text-transform:uppercase;letter-spacing:.05em}.setting-bg{border:1px solid var(--soft);border-radius:17px;overflow:hidden}.setting{min-height:58px;padding:11px 15px;border-bottom:1px solid var(--soft);display:flex;align-items:center;gap:16px}.setting:last-child{border-bottom:0}.setting b{display:block;font-size:14px}.setting small{display:block;color:var(--muted);margin-top:3px}.setting .right{margin-left:auto;color:var(--muted)}.setting.action{width:100%;background:#fff;text-align:left}.setting.action:hover{background:#fafafa}.setting.action.danger{color:var(--red)}.toggle{width:46px;height:27px;border-radius:999px;background:#d1d1d6;padding:2px;transition:.2s}.toggle:after{content:"";display:block;width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:.25s var(--ease)}.toggle.on{background:var(--green)}.toggle.on:after{transform:translateX(19px)}
.toast{position:absolute;z-index:70;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;padding:11px 16px;border-radius:12px;background:rgba(29,29,31,.92);color:#fff;font-size:13px;font-weight:550;pointer-events:none;transition:.28s var(--ease);box-shadow:0 8px 24px rgba(0,0,0,.2)}.toast.show{opacity:1;transform:translate(-50%,0)}.modal-layer{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.22);backdrop-filter:blur(3px);display:grid;place-items:center;opacity:0;pointer-events:none;transition:.22s}.modal-layer.show{opacity:1;pointer-events:auto}.modal{width:min(430px,calc(100% - 40px));background:#fff;border-radius:22px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.26);transform:translateY(12px) scale(.97);transition:.3s var(--ease)}.show .modal{transform:none}.modal h2{font-size:22px;margin-bottom:8px}.modal p{color:var(--muted);font-size:14px;line-height:1.55}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.warning-copy{padding:12px;border-radius:12px;background:var(--redbg);color:#8f0010!important;font-size:12px!important}
@media(max-width:820px){.content{padding:30px 26px}.shell{grid-template-columns:158px 1fr}.retrieve-layout{grid-template-columns:1fr}.detail-pane{display:none}.display{font-size:38px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body><main class="app" aria-label="MyKeys">
<header class="titlebar" data-tauri-drag-region><div class="brand" data-tauri-drag-region><img src="assets/icons/icon.png" alt=""><span data-tauri-drag-region>MyKeys</span></div><div class="title-actions"><button class="icon-btn" id="resetDemo" title="锁定保险库" aria-label="锁定保险库">↻</button></div></header>
<div class="viewport">
<section class="page active" id="welcome"><div class="center-page"><div class="welcome"><img class="hero-logo" src="assets/icons/mykeys-logo-v2.png" alt="MyKeys Logo"><h1 class="display">你的密钥，只在这里。</h1><p class="lede">MyKeys 将 API Key 加密保存在这台设备上。没有账号，没有云端，也没有遥测。</p><button class="primary" data-go="setup">开始设置</button><p class="fine" style="margin-top:18px">大约需要 1 分钟</p></div></div></section>
<section class="page" id="setup"><div class="onboard"><div class="progress" id="progress"><i class="on"></i><i></i><i></i><i></i></div><div class="step-wrap"><div class="step" id="stepBox"></div></div><div class="onboard-foot"><button class="text-btn" id="stepBack">返回</button><button class="primary" id="stepNext">下一步</button></div></div></section>
<section class="page" id="unlock"><div class="center-page"><form class="unlock-card" id="unlockForm"><img class="hero-logo" src="assets/icons/icon.png" alt=""><h1>欢迎回来</h1><p id="unlockHint">输入主密码以打开保险库</p><label class="field" style="text-align:left"><span>主密码</span><div class="pass-wrap"><input class="input" id="unlockPassword" type="password" autocomplete="off" placeholder="输入主密码"><button type="button" class="show-pass">显示</button></div></label><button class="primary wide">解锁</button><button type="button" class="text-btn" id="forgotBtn" style="margin-top:10px">忘记主密码？</button></form></div></section>
<section class="page" id="home"><div class="home-content"><div class="home-inner"><h1>今天要做什么？</h1><p>保险库已在这台设备上安全打开</p><div class="actions"><button class="action-card" data-go="save"><span class="symbol">＋</span><b>存入密钥</b><span>加密保存一个新的 API Key</span><em>→</em></button><button class="action-card fetch" data-go="retrieve"><span class="symbol">⌕</span><b>取用密钥</b><span>搜索、查看或安全复制</span><em>→</em></button></div></div></div></section>
<section class="page" id="save"><div class="shell"><aside class="sidebar"></aside><div class="content"><div class="page-head"><div><h1>存入密钥</h1><p>输入原始 API Key，其余交给 MyKeys</p></div></div><form id="saveForm" class="form-grid"><label class="field"><span>名称</span><input class="input" id="keyName" required maxlength="256" placeholder="例如：个人开发"></label><div class="field"><span>厂商</span><div class="provider-picker" id="providerPicker"><input id="providerValue" type="hidden" value="OpenAI"><button class="provider-trigger" id="providerTrigger" type="button" aria-haspopup="listbox" aria-expanded="false"><span class="provider-mark"><img src="assets/providers/openai.svg" alt=""></span><span class="provider-name">OpenAI</span><i class="provider-chevron" aria-hidden="true"></i></button><div class="provider-menu" id="providerMenu" role="listbox" aria-label="选择厂商"></div></div></div><label class="field span-2"><span>API Key <small>保存后不会再次完整显示</small></span><div class="pass-wrap"><input class="input secret-demo" id="keySecret" required maxlength="65536" type="password" placeholder="粘贴密钥"><button type="button" class="show-pass">显示</button></div></label><details class="details span-2"><summary>添加详细信息</summary><div class="form-grid"><label class="field"><span>到期时间 <small>可选</small></span><input class="input" id="keyExpires" type="date"></label><label class="field"><span>权限 <small>可选</small></span><input class="input" id="keyPermissions" maxlength="2048" placeholder="例如：模型调用、只读"></label><label class="field span-2"><span>备注 <small>可选</small></span><textarea id="keyNotes" maxlength="65536" placeholder="用途、项目或其他提醒"></textarea></label></div></details><div class="form-actions span-2"><button type="button" class="secondary" data-go="home">取消</button><button class="primary">加密保存</button></div></form></div></div></section>
<section class="page" id="retrieve"><div class="shell"><aside class="sidebar"></aside><div class="content"><div class="page-head"><div><h1>取用密钥</h1><p>搜索只在已解锁的内存中进行</p></div><button class="primary" data-go="save">存入新的</button></div><div class="retrieve-layout"><div class="list-pane"><input class="search" id="searchKeys" placeholder="搜索名称或厂商"><div class="filters"><button class="chip on" data-filter="all">全部</button><button class="chip" data-filter="OpenAI">OpenAI</button><button class="chip" data-filter="Anthropic">Anthropic</button><button class="chip" data-filter="GitHub">GitHub</button></div><div class="key-list" id="keyList"></div></div><div class="detail-pane" id="detailPane"></div></div></div></div></section>
<section class="page" id="settings"><div class="shell"><aside class="sidebar"></aside><div class="content"><div class="page-head"><div><h1>设置</h1><p>安全策略与本机保险库</p></div></div><div class="settings-list"><section class="settings-group"><div class="settings-label">解锁</div><div class="setting-bg"><button class="setting action" id="unlockMode"><div><b>打开 MyKeys 时</b><small>每次启动都要求主密码</small></div><span class="right">更改 ›</span></button><div class="setting" id="retrieveSetting"><div><b>取用时再次验证</b><small>验证通过后 5 分钟内无需重复输入</small></div><button class="toggle on right" id="retrieveToggle" aria-label="取用时再次验证"></button></div><button class="setting action" id="lockNow"><div><b>立即锁定</b><small>清除当前解锁会话</small></div><span class="right">›</span></button></div></section><section class="settings-group"><div class="settings-label">密码</div><div class="setting-bg"><button class="setting action" id="changePassword"><div><b>修改主密码</b><small>只重新保护数据密钥，现有记录无需逐条迁移</small></div><span class="right">›</span></button></div></section><section class="settings-group"><div class="settings-label">危险操作</div><div class="setting-bg"><button class="setting action danger" id="destroyVault"><div><b>销毁保险库</b><small>删除本机中由 MyKeys 管理的全部密钥</small></div><span class="right">›</span></button></div></section><p class="fine">MyKeys · 数据只保存在这台设备上 · 使用加密保险库</p></div></div></div></section>
</div><div class="toast" id="toast" role="status"></div><div class="modal-layer" id="modalLayer"><div class="modal" id="modal"></div></div></main>
<script>
const providers=[{name:'OpenAI',logo:'openai.svg'},{name:'Anthropic',logo:'anthropic.svg'},{name:'Google Gemini',logo:'google-gemini.svg'},{name:'DeepSeek',logo:'deepseek.svg'},{name:'GitHub',logo:'github.svg'},{name:'AWS',logo:'aws.svg'},{name:'Microsoft Azure',logo:'microsoft-azure.svg'},{name:'Cloudflare',logo:'cloudflare.svg'},{name:'xAI',logo:'xai.svg'},{name:'Mistral AI',logo:'mistral-ai.svg'},{name:'其他',logo:null}];
const invoke=window.__TAURI__?.core?.invoke;const state={page:'welcome',step:0,mode:'每次启动',retrieveAuth:true,authorized:false,selected:0,revealed:false,masterPassword:'',passwordless:false,native:!!invoke};
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
let keys=state.native?[]:[{id:'demo-1',name:'个人开发',provider:'OpenAI',logo:'openai.svg',masked:'sk-proj-••••••••••••••••9K2m',secret:'sk-proj-demo-only-8N4P9K2m',status:'可用',cls:'',expires:'2027年3月18日',permission:'模型调用',note:'日常原型和个人项目'},{id:'demo-2',name:'Claude 研究',provider:'Anthropic',logo:'anthropic.svg',masked:'sk-ant-••••••••••••••••M7qd',secret:'sk-ant-demo-only-34XLM7qd',status:'6 天后到期',cls:'warn',expires:'2026年9月18日',permission:'Workspace',note:'研究环境'},{id:'demo-3',name:'CI 发布',provider:'GitHub',logo:'github.svg',masked:'github_pat_••••••••••••V2ra',secret:'github_pat_demo-only-92JKV2ra',status:'已过期',cls:'bad',expires:'2026年8月30日',permission:'Packages: write',note:'需要轮换'}];
const side=`<nav class="nav"><button class="nav-btn" data-go="home">首页</button><button class="nav-btn" data-go="save">存入</button><button class="nav-btn" data-go="retrieve">取用</button><button class="nav-btn" data-go="settings">设置</button></nav><div class="status"><span class="safe-dot"></span>保险库已解锁<br>仅保存在此设备</div>`;document.querySelectorAll('.sidebar').forEach(x=>x.innerHTML=side);
function go(id,back=false){if(id===state.page)return;const from=document.getElementById(state.page),to=document.getElementById(id);if(!to)return;from.className=`page ${back?'back-leave':'leaving'}`;to.className=`page ${back?'back-enter':'entering'}`;state.page=id;setTimeout(()=>{from.className='page';to.className='page active'},430);document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('on',b.dataset.go===id));if(id==='retrieve')loadKeys().then(renderKeys);if(id==='settings')paintUnlockMode()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go);const k=e.target.closest('[data-skip-password]');if(k){state.passwordless=true;state.retrieveAuth=false;state.masterPassword='';state.step=3;renderStep()}const s=e.target.closest('.show-pass');if(s){const i=s.parentElement.querySelector('input');i.type=i.type==='password'?'text':'password';s.textContent=i.type==='password'?'显示':'隐藏'}});
const steps=[()=>`<h2>创建你的主密码</h2><p>它是打开保险库的唯一密码。MyKeys 不会保存密码原文，也无法替你找回。</p><label class="field"><span>主密码 <small>建议使用 4–6 个随机词或 16 位以上随机字符</small></span><div class="pass-wrap"><input class="input setup-pass" id="p1" type="password" minlength="16" autocomplete="new-password" placeholder="至少 16 个字符"><button type="button" class="show-pass">显示</button></div></label><label class="field"><span>再次输入</span><div class="pass-wrap"><input class="input setup-pass" id="p2" type="password" minlength="16" autocomplete="new-password" placeholder="再次输入主密码"><button type="button" class="show-pass">显示</button></div></label><div class="match" id="match">✓ 两次输入一致</div><div class="fine" style="margin-top:10px">不想设密码？<button type="button" class="text-btn" data-skip-password style="font-size:12px;padding:2px 7px">不设置主密码，打开就能用</button></div>`,()=>`<h2>选择解锁方式</h2><p>之后可以在设置中更改。安全模式不会影响保险库文件的加密。</p><div class="choices">${modeChoices()}</div>`,()=>`<h2>保护每一次取用</h2><p>复制或显示完整密钥前可以再次验证身份。通过后会获得 5 分钟授权。</p><div class="setting-bg"><div class="setting"><div><b>取用时再次验证</b><small>推荐在共享办公环境中开启</small></div><button class="toggle ${state.retrieveAuth?'on':''}" id="setupRetrieveToggle"></button></div></div><p class="fine" style="margin-top:14px">即使关闭此项，密钥仍会加密保存在本机。</p>`,()=>`<div style="text-align:center"><div class="complete-mark">✓</div><h2>保险库已准备好</h2><p>现在可以存入第一个 API Key。MyKeys 不会联网验证密钥，也不会把它发送到任何服务器。</p></div>`];
function modeChoices(){return['每次启动','72 小时','系统凭据'].map(m=>`<button class="choice ${state.mode===m?'selected':''}" data-mode="${m}"><i class="radio"></i><span><b>${m}</b><small>${m==='每次启动'?'每次打开都输入主密码，适合敏感环境。':m==='72 小时'?'到期后强制重新验证主密码。':'通过本机安全凭据服务解锁。'}</small></span></button>`).join('')}
function renderStep(){stepBox.innerHTML=steps[state.step]();document.querySelectorAll('#progress i').forEach((x,i)=>x.classList.toggle('on',i===state.step));stepBack.style.visibility=state.step===0?'hidden':'visible';stepNext.textContent=state.step===3?'进入 MyKeys':'下一步'}
stepNext.onclick=async()=>{if(state.step===0){const a=p1.value,b=p2.value;if([...a].length<16||a!==b){toast('请使用至少 16 个字符，并确保两次输入一致');return}state.masterPassword=a}if(state.step<3){state.step++;renderStep()}else{try{if(state.native){if(state.passwordless){await invoke('initialize_passwordless');state.mode='无需主密码'}else{await invoke('initialize',{password:state.masterPassword,unlockMode:state.mode,retrieveAuth:state.retrieveAuth})}}state.masterPassword='';go('home');toast('保险库已创建')}catch(err){toast(String(err))}}};stepBack.onclick=()=>{if(state.step>0){state.step=state.passwordless?0:state.step-1;renderStep()}};setup.onclick=e=>{const c=e.target.closest('[data-mode]');if(c){state.mode=c.dataset.mode;renderStep()}if(e.target.closest('#setupRetrieveToggle')){state.retrieveAuth=!state.retrieveAuth;renderStep()}};setup.oninput=e=>{if(e.target.matches('.setup-pass'))document.getElementById('match').classList.toggle('show',[...p1.value].length>=16&&p1.value===p2.value)};
unlockForm.onsubmit=async e=>{e.preventDefault();if(!unlockPassword.value){unlockForm.classList.remove('shake');void unlockForm.offsetWidth;unlockForm.classList.add('shake');unlockHint.textContent='请输入主密码';return}try{if(state.native)await invoke('unlock',{password:unlockPassword.value});state.authorized=false;unlockPassword.value='';closeModal();go('home');toast('保险库已解锁')}catch(err){unlockHint.textContent=String(err);unlockForm.classList.remove('shake');void unlockForm.offsetWidth;unlockForm.classList.add('shake')}};forgotBtn.onclick=()=>openModal(`<h2>无法找回主密码</h2><p>MyKeys 没有密码提示、后门或云端恢复。你仍可销毁当前保险库并重新开始。</p><p class="fine">若曾关闭主密码，保险库由系统钥匙串解锁；钥匙串被重置或更换设备后同样无法恢复。</p><p class="warning-copy">销毁不会撤销厂商侧仍然有效的 API Key。</p><label class="field"><span>输入「删除全部数据」以确认</span><input class="input" id="destroyText" autocomplete="off"></label><div class="modal-actions"><button class="secondary" data-close>取消</button><button class="danger-btn" id="destroyConfirm" disabled>销毁并重新开始</button></div>`);
const providerPickerEl=document.getElementById('providerPicker'),providerTriggerEl=document.getElementById('providerTrigger'),providerMenuEl=document.getElementById('providerMenu'),providerValueEl=document.getElementById('providerValue');
function providerMark(p){return p.logo?`<span class="provider-mark"><img src="assets/providers/${p.logo}" alt=""></span>`:`<span class="provider-mark provider-other" aria-hidden="true">•••</span>`}
providerMenuEl.innerHTML=providers.map((p,i)=>`<button class="provider-option${i===0?' selected':''}" type="button" role="option" aria-selected="${i===0}" data-provider="${p.name}">${providerMark(p)}<span class="provider-name">${p.name}</span><span class="provider-check" aria-hidden="true">✓</span></button>`).join('');
function setProvider(name){const p=providers.find(x=>x.name===name)||providers[0];providerValueEl.value=p.name;providerTriggerEl.querySelector('.provider-mark').outerHTML=providerMark(p);providerTriggerEl.querySelector('.provider-name').textContent=p.name;providerMenuEl.querySelectorAll('.provider-option').forEach(o=>{const selected=o.dataset.provider===p.name;o.classList.toggle('selected',selected);o.setAttribute('aria-selected',String(selected))})}
function openProvider(){providerPickerEl.classList.add('open');providerTriggerEl.setAttribute('aria-expanded','true')}function closeProvider(focus=false){providerPickerEl.classList.remove('open');providerTriggerEl.setAttribute('aria-expanded','false');if(focus)providerTriggerEl.focus()}
providerTriggerEl.onclick=()=>providerPickerEl.classList.contains('open')?closeProvider():openProvider();providerMenuEl.onclick=e=>{const option=e.target.closest('.provider-option');if(option){setProvider(option.dataset.provider);closeProvider(true)}};providerTriggerEl.onkeydown=e=>{if(e.key==='ArrowDown'||e.key==='Enter'||e.key===' '){e.preventDefault();openProvider();(providerMenuEl.querySelector('.selected')||providerMenuEl.firstElementChild).focus()}if(e.key==='Escape')closeProvider()};providerMenuEl.onkeydown=e=>{const options=[...providerMenuEl.querySelectorAll('.provider-option')],index=options.indexOf(document.activeElement);if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();options[(index+1)%options.length].focus()}if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();options[(index-1+options.length)%options.length].focus()}if(e.key==='Escape'){e.preventDefault();closeProvider(true)}};document.addEventListener('click',e=>{if(!providerPickerEl.contains(e.target))closeProvider()});
saveForm.onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,name=document.getElementById('keyName'),secret=document.getElementById('keySecret'),expires=document.getElementById('keyExpires'),permissions=document.getElementById('keyPermissions'),notes=document.getElementById('keyNotes');try{if(state.native)await invoke('add_key',{input:{name:name.value,provider:providerValueEl.value,secret:secret.value,expiresAt:expires.value||null,permissions:permissions.value||null,notes:notes.value||null}});toast('已加密保存');f.reset();setProvider('OpenAI');setTimeout(()=>go('retrieve'),650)}catch(err){toast(String(err))}};
async function loadKeys(){if(!state.native)return;try{const rows=await invoke('list_keys');keys=rows.map(r=>({id:r.id,name:r.name,provider:r.provider,logo:providerLogo(r.provider),masked:r.masked,secret:'',status:expiryStatus(r.expiresAt).text,cls:expiryStatus(r.expiresAt).cls,expires:r.expiresAt||'未设置',permission:r.permissions||'未记录',note:r.notes||'—'}));state.selected=Math.min(state.selected,Math.max(0,keys.length-1))}catch(err){toast(String(err))}}
function providerLogo(name){return providers.find(p=>p.name===name)?.logo||'openai.svg'}function expiryStatus(date){if(!date)return{text:'可用',cls:''};const days=(new Date(date+'T23:59:59')-new Date())/86400000;return days<0?{text:'已过期',cls:'bad'}:days<=7?{text:Math.ceil(days)+' 天后到期',cls:'warn'}:{text:'可用',cls:''}}
function renderKeys(){const q=searchKeys.value.toLowerCase(),filter=document.querySelector('.chip.on')?.dataset.filter||'all',shown=keys.filter(k=>(filter==='all'||k.provider===filter)&&(k.name+k.provider).toLowerCase().includes(q));keyList.innerHTML=shown.length?shown.map(k=>`<button class="key-row ${keys.indexOf(k)===state.selected?'on':''}" data-key="${keys.indexOf(k)}"><img class="provider-logo" src="assets/providers/${escapeHtml(k.logo)}" alt=""><span class="key-meta"><b>${escapeHtml(k.name)}</b><span>${escapeHtml(k.provider)}</span></span><span class="badge ${escapeHtml(k.cls)}">${escapeHtml(k.status)}</span></button>`).join(''):`<div class="empty">${keys.length?'没有找到匹配的密钥':'还没有保存密钥'}</div>`;renderDetail()}
function renderDetail(){const k=keys[state.selected];if(!k){detailPane.innerHTML='<div class="empty">存入第一个密钥后，详情会显示在这里</div>';return}detailPane.innerHTML=`<div class="detail-top"><img class="provider-logo" src="assets/providers/${escapeHtml(k.logo)}" alt=""><div><h2>${escapeHtml(k.name)}</h2><p>${escapeHtml(k.provider)}</p></div><span class="badge ${escapeHtml(k.cls)}" style="margin-left:auto">${escapeHtml(k.status)}</span></div><label class="field"><span>API Key</span><div class="secret-box"><span class="secret-value">${escapeHtml(state.revealed?k.secret:k.masked)}</span><span class="secret-actions"><button class="mini" id="revealKey">${state.revealed?'隐藏':'显示'}</button><button class="mini" id="copyKey">复制</button></span></div></label><dl class="info-grid"><div class="info"><dt>到期时间</dt><dd>${escapeHtml(k.expires)}</dd></div><div class="info"><dt>权限</dt><dd>${escapeHtml(k.permission)}</dd></div><div class="info"><dt>备注</dt><dd>${escapeHtml(k.note)}</dd></div><div class="info"><dt>存储方式</dt><dd>本机加密保险库</dd></div></dl>`}
keyList.onclick=e=>{const r=e.target.closest('[data-key]');if(r){state.selected=+r.dataset.key;state.revealed=false;renderKeys()}};searchKeys.oninput=renderKeys;document.querySelector('.filters').onclick=e=>{const c=e.target.closest('.chip');if(c){document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');renderKeys()}};detailPane.onclick=e=>{if(e.target.closest('#revealKey'))secure(async()=>{try{if(state.native)keys[state.selected].secret=await invoke('reveal_key',{id:keys[state.selected].id});state.revealed=!state.revealed;renderDetail();if(state.revealed){toast('10 秒后自动隐藏');setTimeout(()=>{state.revealed=false;keys[state.selected].secret='';if(state.page==='retrieve')renderDetail()},10000)}}catch(err){toast(String(err))}});if(e.target.closest('#copyKey'))secure(async()=>{try{const secret=state.native?await invoke('reveal_key',{id:keys[state.selected].id}):keys[state.selected].secret;if(navigator.clipboard)await navigator.clipboard.writeText(secret);toast('已复制，30 秒后尝试清除剪贴板');setTimeout(async()=>{try{if(await navigator.clipboard.readText()===secret)await navigator.clipboard.writeText('')}catch{}},30000)}catch(err){toast(String(err))}})};
function secure(action){if(!state.retrieveAuth||state.authorized){action();return}openModal(`<h2>验证后继续</h2><p>取用完整密钥前需要主密码。验证通过后 5 分钟内无需再次输入。</p><label class="field"><span>主密码</span><input class="input" id="authPass" type="password" placeholder="输入主密码"></label><div class="modal-actions"><button class="secondary" data-close>取消</button><button class="primary" id="authConfirm">验证</button></div>`);setTimeout(()=>authConfirm.onclick=async()=>{if(!authPass.value){toast('请输入主密码');return}try{if(state.native)await invoke('authorize_retrieval',{password:authPass.value});state.authorized=true;closeModal();action();setTimeout(()=>state.authorized=false,300000)}catch(err){toast(String(err))}},0)}
retrieveToggle.onclick=e=>{if(state.passwordless){toast('无主密码模式下没有取用验证');return}state.retrieveAuth=!state.retrieveAuth;e.currentTarget.classList.toggle('on',state.retrieveAuth);openSettingsPassword()};lockNow.onclick=async()=>{if(state.passwordless){toast('无主密码模式下保险库不会锁定');return}try{if(state.native)await invoke('lock');state.authorized=false;go('unlock');toast('保险库已锁定')}catch(err){toast(String(err))}};unlockMode.onclick=()=>{const plain=state.passwordless,pick=plain?'每次启动':state.mode,list=plain?['每次启动','72 小时','系统凭据']:['每次启动','72 小时','系统凭据','无需主密码'],field=plain?'<label class="field" style="margin-top:16px"><span>新主密码</span><input class="input" id="newSettingsPassword" type="password" minlength="16" autocomplete="new-password" placeholder="至少 16 个字符"></label><p class="fine" style="margin-top:-4px">主密码只在这台设备上派生，无法找回。</p>':'<label class="field" style="margin-top:16px"><span>主密码</span><input class="input" id="settingsPassword" type="password" autocomplete="current-password" placeholder="验证后保存"></label>';openModal(`<h2>打开 MyKeys 时</h2><p>${plain?'当前保险库没有主密码。设置主密码后才能选择其他解锁方式。':'选择适合这台设备的解锁策略。'}</p><div class="choices">${list.map(m=>`<button class="choice ${pick===m?'selected':''}" data-modal-mode="${m}"><i class="radio"></i><span><b>${m}</b>${m==='无需主密码'?'<small>能打开这台电脑的人都能存取密钥</small>':''}</span></button>`).join('')}</div>${field}<div class="modal-actions"><button class="secondary" data-close>取消</button><button class="primary" id="${plain?'saveNewPassword':'saveMode'}">完成</button></div>`)};changePassword.onclick=()=>{if(state.passwordless){unlockMode.onclick();return}openModal(`<h2>修改主密码</h2><p>确认旧密码后，MyKeys 会使用新密码重新保护数据密钥，不逐条迁移现有 API Key。</p><label class="field"><span>当前主密码</span><input class="input" id="oldPassword" type="password" autocomplete="current-password"></label><label class="field"><span>新主密码</span><input class="input" id="newPassword" type="password" minlength="16" autocomplete="new-password" placeholder="至少 16 个字符"></label><div class="modal-actions"><button class="secondary" data-close>取消</button><button class="primary" id="passwordDone">更新密码</button></div>`)};destroyVault.onclick=()=>openModal(`<h2>销毁保险库？</h2><p>这会删除本机中由 MyKeys 管理的全部密钥、设置和解锁凭据。该操作无法撤销。</p><p class="warning-copy">厂商侧 API Key 不会自动失效。如有泄露风险，请前往对应厂商撤销。</p><label class="field"><span>输入「删除全部数据」以确认</span><input class="input" id="destroyText" autocomplete="off"></label><div class="modal-actions"><button class="secondary" data-close>取消</button><button class="danger-btn" id="destroyConfirm" disabled>销毁保险库</button></div>`);function openSettingsPassword(){openModal(`<h2>保存安全设置</h2><p>更改取用验证需要确认主密码。</p><label class="field"><span>主密码</span><input class="input" id="settingsPassword" type="password" autocomplete="current-password"></label><div class="modal-actions"><button class="secondary" id="cancelSettings">取消</button><button class="primary" id="saveMode">保存</button></div>`)}
function openModal(html){modal.innerHTML=html;modalLayer.classList.add('show')}function closeModal(){modalLayer.classList.remove('show');modal.textContent=''}modalLayer.onclick=async e=>{if(e.target===modalLayer||e.target.closest('[data-close]'))closeModal();const m=e.target.closest('[data-modal-mode]');if(m){state.mode=m.dataset.modalMode;document.querySelectorAll('[data-modal-mode]').forEach(x=>x.classList.toggle('selected',x===m))}if(e.target.id==='cancelSettings'){state.retrieveAuth=!state.retrieveAuth;retrieveToggle.classList.toggle('on',state.retrieveAuth);closeModal()}if(e.target.id==='saveMode'){try{if(state.mode==='无需主密码'){if(state.native)await invoke('clear_master_password',{password:settingsPassword.value});state.passwordless=true;state.retrieveAuth=false;toast('已关闭主密码')}else{if(state.native)await invoke('update_settings',{unlockMode:state.mode,retrieveAuth:state.retrieveAuth,password:settingsPassword.value});toast('安全设置已更新')}settingsPassword.value='';closeModal();paintUnlockMode()}catch(err){toast(String(err))}}if(e.target.id==='saveNewPassword'){try{const mode=state.mode==='无需主密码'?'每次启动':state.mode;if(state.native)await invoke('set_master_password',{newPassword:newSettingsPassword.value,unlockMode:mode,retrieveAuth:state.retrieveAuth});state.passwordless=false;state.mode=mode;newSettingsPassword.value='';closeModal();paintUnlockMode();toast('主密码已设置')}catch(err){toast(String(err))}}if(e.target.id==='passwordDone'){try{if(state.native)await invoke('change_password',{oldPassword:oldPassword.value,newPassword:newPassword.value});oldPassword.value='';newPassword.value='';closeModal();toast('主密码已更新')}catch(err){toast(String(err))}}if(e.target.id==='destroyConfirm'&&!e.target.disabled){try{if(state.native)await invoke('destroy_vault',{confirmation:destroyText.value});destroyText.value='';closeModal();toast('保险库已销毁');setTimeout(reset,700)}catch(err){toast(String(err))}}};modalLayer.oninput=e=>{if(e.target.id==='destroyText')destroyConfirm.disabled=e.target.value!=='删除全部数据'};
let toastTimer;function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2600)}const toastEl=document.getElementById('toast');function reset(){state.step=0;state.mode='每次启动';state.retrieveAuth=true;state.authorized=false;state.revealed=false;state.masterPassword='';state.passwordless=false;keys.forEach(k=>k.secret='');retrieveToggle.classList.add('on');renderStep();go('welcome',true)}resetDemo.onclick=async()=>{if(state.native){try{await invoke('lock');go('unlock');toast('保险库已锁定')}catch(err){toast(String(err))}}else reset()};
async function syncLockState(){if(!state.native)return;try{const s=await invoke('status');if(s.unlocked){state.passwordless=!!s.passwordless;state.mode=s.unlockMode;state.retrieveAuth=s.retrieveAuth;paintUnlockMode()}if(!s.unlocked&&state.passwordless){try{if(await invoke('try_system_unlock')){state.authorized=false;paintUnlockMode();if(state.page==='unlock')go('home');return}}catch{}}if(!s.unlocked&&state.page!=='unlock'&&state.page!=='welcome'){keys.forEach(k=>k.secret='');state.revealed=false;state.authorized=false;go('unlock');toast('保险库已自动锁定')}}catch{}}async function boot(){renderStep();renderKeys();if(!state.native){paintUnlockMode();return}try{const s=await invoke('status');state.mode=s.unlockMode;state.retrieveAuth=s.retrieveAuth;state.passwordless=!!s.passwordless;paintUnlockMode();if(!s.initialized)return;if(s.unlocked){go('home');return}try{if(await invoke('try_system_unlock')){go('home');return}}catch{}go('unlock')}catch(err){toast(String(err))}}window.addEventListener('blur',()=>{keys.forEach(k=>k.secret='');state.revealed=false;state.authorized=false;if(state.page==='retrieve')renderDetail()});window.addEventListener('focus',syncLockState);boot();if(state.native)setInterval(syncLockState,30000);
function paintUnlockMode(){const row=document.getElementById('retrieveSetting'),label=document.getElementById('changePassword');row.style.display=state.passwordless?'none':'';lockNow.style.display=state.passwordless?'none':'';retrieveToggle.classList.toggle('on',state.retrieveAuth&&!state.passwordless);unlockMode.querySelector('small').textContent=state.passwordless?'打开即用，不需要主密码':state.mode==='每次启动'?'每次启动都要求主密码':state.mode==='72 小时'?'信任本机 72 小时':'使用本机系统凭据解锁';label.querySelector('b').textContent=state.passwordless?'设置主密码':'修改主密码';label.querySelector('small').textContent=state.passwordless?'给保险库加上主密码，同时获得恢复途径':'只重新保护数据密钥，现有记录无需逐条迁移'}
</script></body></html>
